name: benchmark
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  verify_preference:
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["4.0", "jruby-10.0", "truffleruby"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    # Longer warmup and measurement windows than the benchmark defaults:
    # with the default 0.03s warmup the JIT engines (TruffleRuby in
    # particular) are measured cold, which flips close parser pairs and
    # flakes the ranking assertion.
    - run: BENCHMARK_ARGS="--verify-preference --warmup 2 --time 1 --samples 3" bundle exec rake benchmark
