name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0', 'jruby-10.0', 'jruby-10.1', 'ruby-head', 'jruby-head', 'truffleruby-head']
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - ruby-version: truffleruby-head
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    # The -head Rubies, TruffleRuby included, can fail without failing the
    # run (or the badge). TruffleRuby is still experimental, and its JVM
    # has crashed on exit after every test passed.
    continue-on-error: ${{ endsWith(matrix.ruby-version, '-head') }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false # Do not bundle install yet, need recent versions for Windows
    - name: Run tests
      env:
        JRUBY_OPTS: ${{ startsWith(matrix.ruby-version, 'jruby') && '--debug' || '' }}
      run: |
        gem install bundler
        bundle install
        bundle exec rake test
